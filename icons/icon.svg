<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181030"/>
      <stop offset="50%" stop-color="#0c0f1d"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Outer Glow Ring -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Cassette Tape Body -->
  <rect x="20" y="32" width="88" height="60" rx="8" fill="#16192b" stroke="url(#neonGrad)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Cassette Label Area -->
  <path d="M 26 40 L 102 40 L 96 74 L 32 74 Z" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Tape Spools -->
  <circle cx="44" cy="58" r="10" fill="#0d0f17" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="44" cy="58" r="4" fill="#c084fc"/>
  <circle cx="84" cy="58" r="10" fill="#0d0f17" stroke="#06b6d4" stroke-width="2.5"/>
  <circle cx="84" cy="58" r="4" fill="#38bdf8"/>

  <!-- Center Window -->
  <rect x="54" y="52" width="20" height="12" rx="2" fill="#0d0f17" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="44" y1="58" x2="84" y2="58" stroke="#ec4899" stroke-width="2" stroke-dasharray="2 3"/>

  <!-- Neural / Audio Soundwave Sparks -->
  <path d="M 36 102 Q 44 94 52 102 T 68 102 T 84 102 T 96 102" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- AI Star / Sparkle in Top Right -->
  <path d="M 98 22 Q 104 22 104 16 Q 104 22 110 22 Q 104 22 104 28 Q 104 22 98 22 Z" fill="#f472b6" filter="url(#glow)"/>
  <circle cx="104" cy="22" r="1.5" fill="#fff"/>
</svg>